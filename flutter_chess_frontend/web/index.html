<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Chess companion app built with Flutter." />

    <!-- Important when this is hosted under a non-root path (common in previews) -->
    <base href="./" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="flutter_chess_frontend" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>flutter_chess_frontend</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!-- Flutter will replace this with the app -->
    <noscript>This app requires JavaScript to run.</noscript>

    <script>
      // Bootstrap Flutter Web without relying on generated files being present in `web/`.
      // Some preview/static hosts serve `web/` directly, where `flutter_bootstrap.js` won't exist.
      window.addEventListener("load", function () {
        var scriptTag = document.createElement("script");
        scriptTag.src = "flutter.js";
        scriptTag.type = "application/javascript";
        scriptTag.onload = function () {
          if (!window._flutter || !window._flutter.loader) {
            console.error("Flutter loader not found on window._flutter.loader");
            return;
          }
          window._flutter.loader.loadEntrypoint({
            serviceWorker: {
              // Keep default behavior; hosts can still provide service worker assets when built.
              serviceWorkerVersion: null,
            },
            onEntrypointLoaded: function (engineInitializer) {
              engineInitializer.initializeEngine().then(function (appRunner) {
                appRunner.runApp();
              });
            },
          });
        };
        document.body.appendChild(scriptTag);
      });
    </script>
  </body>
</html>
