    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="flutter_chess_frontend" />

    <!-- Favicon -->

    <title>flutter_chess_frontend</title>

    <meta name="flutter-web-version" content="1" />
